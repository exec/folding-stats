<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folding@home Stats</title>
<meta name="description" content="Folding@home donor and team statistics, with a free public API. No sign-up, no challenge pages, and no rate limits today.">
<meta name="color-scheme" content="dark light">
<link rel="stylesheet" href="/vendor/uPlot.min.css">
<link rel="stylesheet" href="/app.css">
<!-- An alpha helix, drawn the way a ribbon diagram draws one. The mark here used to be
     the DNA emoji: the wrong molecule, since Folding@home simulates proteins folding
     and misfolding rather than anything to do with nucleic acid. It also rendered as
     whatever the reader's emoji font happened to make of it. -->
<link rel="icon" href="/icon.svg" type="image/svg+xml">
</head>
<body>

<header class="header">
  <!-- The accessible name is on the link, not on the wordmark inside it: below 480px
       .brand-name is display:none and so contributes nothing to the name, which used
       to leave a bare diamond as the only route home on a phone. -->
  <a class="brand" href="/" aria-label="Folding Stats — home">
    <span class="brand-mark">◈</span>
    <span class="brand-name">Folding Stats</span>
  </a>

  <nav class="nav">
    <a href="/overview" data-route="/overview">Overview</a>
    <a href="/teams" data-route="/teams">Teams</a>
    <a href="/donors" data-route="/donors">Donors</a>
    <a href="/api" data-route="/api">API</a>
    <a href="/agents" data-route="/agents">Agents</a>
  </nav>

  <div class="search" id="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>
    </svg>
    <input id="q" type="search" placeholder="Search donors and teams"
           autocomplete="off" spellcheck="false" aria-label="Search donors and teams">
    <div class="search-results" id="search-results" role="listbox"></div>
  </div>

  <div class="freshness" id="freshness">
    <span class="dot"></span><span id="freshness-text">…</span>
    <span class="countdown" id="countdown"></span>
  </div>

  <!-- One group, not two loose buttons: they are both "about this site" rather than
       about the data, and spacing them like separate sections of the header spent
       header width saying they were unrelated. -->
  <div class="header-actions">
    <button class="icon-btn" id="theme-toggle" aria-label="Toggle colour theme" title="Toggle theme">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
      </svg>
    </button>

    <!-- Here rather than in the nav: the nav is the data, and a fifth entry there is
         what pushed the links off a phone the first time. A bot is a way to reach the
         data, which is what this group already holds. -->
    <a class="icon-btn" id="bots-link" href="/bots" data-route="/bots"
       aria-label="Chat bots" title="Bots — Discord and friends">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="4" y="8" width="16" height="12" rx="3"></rect>
        <path d="M12 8V4.5"></path><circle cx="12" cy="3" r="1.2"></circle>
        <path d="M9 13.5h.01M15 13.5h.01"></path>
        <path d="M2 12.5v3M22 12.5v3"></path>
      </svg>
    </a>

    <a class="icon-btn" id="source-link" href="https://github.com/exec/folding-stats"
       target="_blank" rel="noopener noreferrer" aria-label="Source code on GitHub" title="Source code — MIT">
      <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"></path>
      </svg>
    </a>
  </div>
</header>

<main id="view" aria-live="polite"></main>

<footer>
  <span>Data from <a href="https://foldingathome.org" rel="noopener">Folding@home</a>, refreshed hourly.</span>
  <span>Not affiliated with the Folding@home project.</span>
  <a href="/api">Free API — no key required</a>
  <a href="/bots">Bots</a>
  <a href="https://github.com/exec/folding-stats" target="_blank" rel="noopener noreferrer">Source code — MIT</a>
  <a href="/privacy">Privacy</a>
  <a href="/disclaimer">Disclaimer</a>
</footer>

<script type="module" src="/app.js"></script>
</body>
</html>
