# Builds the agent for every platform we ask people to run it on, and publishes it
# with checksums.
#
# This is installed software on other people's machines, so the workflow deliberately
# uses no third-party actions. Everything past checking out the code and installing Go
# is a shell command and the GitHub CLI that the runner already has — a release action
# from the marketplace would be one more thing with permission to write releases here,
# and the whole point of publishing checksums is that people should not have to take
# our word for what is in the archive.
name: agent release

on:
  push:
    tags: ['agent/v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release, e.g. agent/v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Test
        run: go test ./...

      - name: Build
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          command -v zip >/dev/null || { echo "zip is missing from the runner"; exit 1; }
          VERSION="${TAG#agent/}"
          mkdir -p dist
          # One loop rather than a matrix: every artefact then lands in the same job,
          # so a single SHA256SUMS covers the whole release rather than one file per
          # platform that nobody can check against the others.
          while read -r os arch ext; do
            [ -n "$os" ] || continue
            out="foldingagent-${VERSION}-${os}-${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath \
                -ldflags "-s -w -X main.version=${VERSION}" \
                -o "dist/foldingagent${ext}" ./cmd/foldingagent
            if [ "$ext" = ".exe" ]; then
              (cd dist && zip -q "${out}.zip" foldingagent.exe && rm foldingagent.exe)
            else
              (cd dist && tar czf "${out}.tar.gz" foldingagent && rm foldingagent)
            fi
          done <<'PLATFORMS'
          linux amd64
          linux arm64
          darwin amd64
          darwin arm64
          windows amd64 .exe
          PLATFORMS
          # Only the archives. Globbing everything would quietly fold a stray build
          # artefact into the manifest if an archiving step ever failed — which is
          # exactly what happened the first time this loop was run by hand.
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#agent/}"
          cat > notes.md <<'NOTES'
          The agent puts one machine's folding client on your dashboard at
          https://folding.exec.codes/fold.

          Install it on any machine that folds. It reads the folding client on
          127.0.0.1 and holds one outbound connection to the relay, so it needs no
          inbound port, no port forwarding, no certificate, and no change to the
          folding client's own configuration.

          Get an enrolment token from the "Add another machine" link on that page, then:

          ```
          FOLDING_ENROL='<token>' ./foldingagent
          ```

          The machine generates its own key on first run and keeps it. The token is
          good once, for fifteen minutes, and proves only that the machine is yours —
          so finding it later in a log is worth nothing to anybody.

          Verify a download against `SHA256SUMS` before running it.
          NOTES
          gh release create "$TAG" dist/* \
            --title "Agent $VERSION" \
            --notes-file notes.md
